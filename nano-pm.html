<!DOCTYPE html>
<!--
  nano-pm — a single-file Gantt PM tool. Open this file in a browser to use it.
  Your data lives inside <div id="data"> below; you can hand-edit it if you like.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nano-pm</title>
<style>
  :root {
    --bar-h: 24px;
    --row-h: 32px;
    --proj-row-h: 36px;
    --topbar-h: 52px;
    --axis-h: 48px;
    --left-w: 240px;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
    --line-soft: #f1f3f5;
    --bg: #ffffff;
    --bg-soft: #fafafa;
    --bg-proj: #f4f5f7;
    --accent: #dc2626;
    --accent-soft: rgba(220,38,38,0.08);
  }
  * { box-sizing: border-box; }
  /* UA [hidden]{display:none} loses to author display:flex; restore it. */
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* === topbar === */
  #topbar {
    height: var(--topbar-h);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    position: relative;
    z-index: 50;
  }
  .brand { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
  .spacer { flex: 1; }
  .topbar-btn {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 6px;
    padding: 5px 10px;
    color: var(--fg);
  }
  .topbar-btn:hover { background: var(--bg-soft); }
  #zoom-controls { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #zoom-controls button {
    border: 0; background: var(--bg); padding: 5px 10px; border-right: 1px solid var(--line);
  }
  #zoom-controls button:last-child { border-right: 0; }
  #zoom-controls button.active { background: var(--fg); color: white; }
  #save-status { color: var(--muted); font-size: 12px; }
  #save-status.dirty { color: var(--accent); }

  #autosave-banner {
    background: #fef3c7; border: 1px solid #fcd34d; border-radius: 6px;
    padding: 4px 10px; font-size: 12px; display: flex; align-items: center; gap: 8px;
  }
  #autosave-banner button { border: 0; background: transparent; text-decoration: underline; padding: 0; }
  #autosave-banner .dismiss { text-decoration: none; font-size: 16px; line-height: 1; padding: 0 4px; }

  /* === main grid === */
  #grid-scroll {
    height: calc(100vh - var(--topbar-h));
    overflow: auto;
    position: relative;
    background: var(--bg);
  }
  #grid {
    display: grid;
    grid-template-columns: var(--left-w) max-content;
    background: var(--bg);
    min-width: 100%;
  }

  .corner {
    position: sticky; top: 0; left: 0; z-index: 4;
    background: var(--bg);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    height: var(--axis-h);
    display: flex; align-items: center; padding: 0 12px;
    color: var(--muted); font-size: 12px;
  }
  #time-axis-cell {
    position: sticky; top: 0; z-index: 3;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    height: var(--axis-h);
  }
  #time-axis {
    position: relative; height: 100%;
  }
  .axis-major {
    position: absolute; top: 4px; height: 18px;
    font-size: 12px; font-weight: 600; color: var(--fg);
    padding: 0 6px; white-space: nowrap;
    border-left: 1px solid var(--line);
  }
  .axis-minor {
    position: absolute; bottom: 0; height: 22px;
    font-size: 11px; color: var(--muted);
    padding: 4px 4px 0;
    border-left: 1px solid var(--line-soft);
    white-space: nowrap;
    overflow: hidden;
  }
  .axis-minor.weekend { background: var(--bg-soft); }

  .left-cell {
    position: sticky; left: 0; z-index: 2;
    background: var(--bg);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line-soft);
    padding: 0 12px;
    display: flex; align-items: center; gap: 8px;
    overflow: hidden;
  }
  .left-cell.proj {
    background: var(--bg-proj);
    height: var(--proj-row-h);
    font-weight: 600;
    cursor: pointer;
  }
  .left-cell.proj:hover { background: #ebedf0; }
  .left-cell.proj .swatch {
    width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0;
  }
  .left-cell.proj .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .left-cell.proj .actions { color: var(--muted); font-size: 11px; }
  .left-cell.task {
    height: var(--row-h);
    padding-left: 28px;
    color: #374151;
    font-size: 12px;
  }
  .left-cell.task .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .left-cell.task .assignees { color: var(--muted); font-size: 11px; flex-shrink: 0; }

  .chart-row {
    position: relative;
    border-bottom: 1px solid var(--line-soft);
    height: var(--row-h);
  }
  .chart-row.proj {
    height: var(--proj-row-h);
    background: var(--bg-proj);
    cursor: crosshair;
  }
  .chart-row .weekend-tile {
    position: absolute; top: 0; bottom: 0;
    background: rgba(0,0,0,0.025);
    pointer-events: none;
  }

  .bar {
    position: absolute;
    height: var(--bar-h);
    top: calc((var(--row-h) - var(--bar-h)) / 2);
    border-radius: 4px;
    cursor: grab;
    user-select: none;
    display: flex;
    align-items: center;
    font-size: 11px;
    color: white;
    text-shadow: 0 1px 1px rgba(0,0,0,0.25);
    /* overflow visible so resize handles and dep-handle aren't clipped at the
       edges; the .bar-label inside has its own overflow:hidden for text. */
    overflow: visible;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,0.15);
  }
  .bar-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 10px;
    pointer-events: none;
  }
  .bar.planned { opacity: 0.55; }
  .bar.blocked {
    background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(255,255,255,0.35) 5px, rgba(255,255,255,0.35) 10px);
    box-shadow: 0 0 0 2px var(--accent), inset 0 -1px 0 rgba(0,0,0,0.15);
  }
  .bar.done { opacity: 0.55; filter: grayscale(0.4); }
  .bar.overdue { box-shadow: -3px 0 0 var(--accent), inset 0 -1px 0 rgba(0,0,0,0.15); }
  .bar.dragging { cursor: grabbing; opacity: 0.9; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.25), inset 0 -1px 0 rgba(0,0,0,0.15); }
  .bar.selected { outline: 2px solid var(--fg); outline-offset: 2px; }
  .bar .resize-handle {
    position: absolute; top: 0; bottom: 0; width: 6px;
    cursor: ew-resize; z-index: 2;
  }
  .bar .resize-handle.resize-start { left: 0; }
  .bar .resize-handle.resize-end { right: 0; }
  /* Visible affordance on hover: a small white pill at each end. */
  .bar:hover .resize-handle::after,
  .bar.dragging .resize-handle::after {
    content: '';
    position: absolute;
    left: 1.5px; right: 1.5px;
    top: 25%; bottom: 25%;
    background: rgba(255,255,255,0.7);
    border-radius: 1.5px;
  }
  .bar .dep-handle {
    position: absolute; right: -8px; top: 50%;
    width: 12px; height: 12px; margin-top: -6px;
    border-radius: 50%; background: white; border: 2px solid var(--fg);
    cursor: crosshair; opacity: 0; transition: opacity .12s;
    z-index: 5;
  }
  .bar:hover .dep-handle { opacity: 1; }

  .milestone {
    position: absolute;
    width: 14px; height: 14px;
    top: 50%; margin-top: -7px;
    transform: rotate(45deg);
    cursor: pointer;
    box-shadow: 0 0 0 1px white, 0 1px 2px rgba(0,0,0,0.3);
  }
  .milestone.overdue { box-shadow: 0 0 0 2px var(--accent), 0 1px 2px rgba(0,0,0,0.3); }
  .milestone.selected { outline: 2px solid var(--fg); outline-offset: 2px; }
  .milestone-label {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--fg);
    white-space: nowrap;
    pointer-events: none;
    padding-left: 4px;
  }

  #today-line {
    position: absolute; top: 0; bottom: 0; width: 0;
    border-left: 1px dashed var(--accent);
    pointer-events: none;
    z-index: 1;
  }

  #arrows {
    position: absolute; top: 0; left: 0;
    pointer-events: none;
    overflow: visible;
  }
  #arrows path { fill: none; stroke: #475569; stroke-width: 1.5; pointer-events: none; }
  #arrows path.selected { stroke: var(--accent); stroke-width: 2; }
  #arrows .hit { fill: none; stroke: transparent; stroke-width: 8; pointer-events: stroke; cursor: pointer; }

  #rubber-band {
    position: absolute; pointer-events: none;
    background: rgba(59,130,246,0.18);
    border: 1px dashed #3b82f6;
    border-radius: 3px;
    z-index: 30;
  }
  #dep-drag {
    position: absolute; pointer-events: none;
    z-index: 30;
  }
  #dep-drag path { fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-dasharray: 4 3; }

  /* === popover === */
  #popover {
    position: fixed; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    padding: 12px; z-index: 100; min-width: 280px;
    display: flex; flex-direction: column; gap: 8px;
  }
  #popover label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 2px; }
  #popover input[type=text], #popover input[type=date], #popover select {
    width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg);
  }
  #popover .row { display: flex; gap: 8px; }
  #popover .row > div { flex: 1; }
  #popover .assignees { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 5px; min-height: 30px; align-items: center; }
  #popover .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 6px; background: var(--bg-soft); border: 1px solid var(--line);
    border-radius: 10px; font-size: 11px;
  }
  #popover .chip button { border: 0; background: transparent; padding: 0; line-height: 1; color: var(--muted); }
  #popover .chip-add {
    border: 1px dashed var(--line); background: transparent; padding: 1px 6px;
    border-radius: 10px; font-size: 11px; color: var(--muted);
  }
  #popover .actions { display: flex; justify-content: space-between; margin-top: 4px; }
  #popover .actions .danger { color: var(--accent); border: 0; background: transparent; }
  #popover .actions .primary { background: var(--fg); color: white; border: 0; padding: 5px 12px; border-radius: 5px; }
  #popover .deps-list { display: flex; flex-direction: column; gap: 4px; }
  #popover .dep-row {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 6px; background: var(--bg-soft);
    border: 1px solid var(--line);
    border-radius: 4px; font-size: 11px;
  }
  #popover .dep-row .dep-arrow { color: var(--muted); font-size: 10px; flex-shrink: 0; }
  #popover .dep-row .dep-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #popover .dep-row .dep-remove {
    border: 0; background: transparent; color: var(--muted);
    padding: 0 4px; font-size: 14px; line-height: 1; cursor: pointer; border-radius: 3px;
  }
  #popover .dep-row .dep-remove:hover { color: var(--accent); background: rgba(220,38,38,0.08); }
  #popover .deps-empty { color: var(--muted); font-size: 11px; padding: 2px 0; }

  /* === project popover === */
  #project-popover {
    position: fixed; background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    padding: 12px; z-index: 100; min-width: 240px;
    display: flex; flex-direction: column; gap: 8px;
  }
  #project-popover input[type=text] {
    width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px;
  }
  #project-popover .colors { display: flex; gap: 4px; flex-wrap: wrap; }
  #project-popover .colors button { width: 22px; height: 22px; border: 2px solid transparent; border-radius: 4px; padding: 0; }
  #project-popover .colors button.active { border-color: var(--fg); }
  #project-popover .actions { display: flex; justify-content: space-between; margin-top: 4px; }
  #project-popover .danger { color: var(--accent); border: 0; background: transparent; }
  #project-popover .primary { background: var(--fg); color: white; border: 0; padding: 5px 12px; border-radius: 5px; }

  /* === modal === */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
  }
  .modal {
    background: var(--bg); border-radius: 10px; padding: 20px;
    min-width: 360px; max-width: 90vw; max-height: 80vh; overflow: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
  }
  .modal h2 { margin: 0 0 8px 0; font-size: 18px; }
  .modal p { color: var(--muted); margin: 0 0 16px 0; }
  .welcome-actions { display: flex; gap: 8px; }
  .welcome-actions button {
    flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg);
  }
  .welcome-actions button.primary { background: var(--fg); color: white; border-color: var(--fg); }

  .people-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .people-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px;
  }
  .people-row input {
    flex: 1; border: 0; background: transparent; padding: 0;
  }
  .people-row .remove { border: 0; background: transparent; color: var(--muted); }
  #people-modal .add-row {
    display: flex; gap: 8px;
  }
  #people-modal .add-row input { flex: 1; padding: 6px 8px; border: 1px solid var(--line); border-radius: 5px; }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal .modal-actions button { padding: 6px 12px; border-radius: 5px; border: 1px solid var(--line); background: var(--bg); }
  .modal .modal-actions .primary { background: var(--fg); color: white; border-color: var(--fg); }

  /* === empty CTA === */
  #empty-cta {
    position: absolute; left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: var(--muted);
    pointer-events: auto;
  }
  #empty-cta button {
    border: 1px solid var(--line); background: var(--bg); border-radius: 6px;
    padding: 8px 14px; font-size: 13px;
  }
</style>
</head>
<body>
  <div id="topbar">
    <div class="brand">nano-pm</div>
    <div id="autosave-banner" hidden>
      <span>Autosave isn't set up.</span>
      <button id="enable-autosave">Click to enable</button>
      <button class="dismiss" id="dismiss-banner" title="Dismiss">×</button>
    </div>
    <div class="spacer"></div>
    <span id="save-status">Not saved yet</span>
    <div id="zoom-controls">
      <button data-zoom="day">Day</button>
      <button data-zoom="week" class="active">Week</button>
      <button data-zoom="month">Month</button>
      <button data-zoom="quarter">Quarter</button>
    </div>
    <button class="topbar-btn" id="today-btn" title="Jump to today (T)">Today</button>
    <button class="topbar-btn" id="people-btn">People</button>
    <button class="topbar-btn" id="add-project-btn" title="Add project">+ Project</button>
    <button class="topbar-btn" id="save-btn" hidden>Save</button>
  </div>

  <div id="grid-scroll">
    <div id="grid">
      <div class="corner">timeline</div>
      <div id="time-axis-cell"><div id="time-axis"></div></div>
      <!-- rows are appended here by JS -->
    </div>
  </div>

  <!-- Inline editor popover -->
  <div id="popover" hidden></div>
  <!-- Project editor popover -->
  <div id="project-popover" hidden></div>

  <!-- Welcome modal -->
  <div id="welcome" class="modal-backdrop" hidden>
    <div class="modal">
      <h2>Welcome to nano-pm</h2>
      <p>A single-file Gantt PM tool. Your data lives in this HTML file — open it, edit, save.</p>
      <div class="welcome-actions">
        <button id="welcome-fresh">Start fresh</button>
        <button class="primary" id="welcome-demo">Try a demo</button>
      </div>
    </div>
  </div>

  <!-- People modal -->
  <div id="people-modal" class="modal-backdrop" hidden>
    <div class="modal">
      <h2>People</h2>
      <p>Team members you can assign to tasks. They aren't users of this tool.</p>
      <div class="people-list" id="people-list"></div>
      <div class="add-row">
        <input id="new-person-name" placeholder="Add a person…" autocomplete="off">
        <button id="add-person-btn">Add</button>
      </div>
      <div class="modal-actions">
        <button class="primary" id="close-people">Done</button>
      </div>
    </div>
  </div>

  <!-- Source-of-truth data block -->
  <div id="data" hidden>
  </div>

<script>
"use strict";

// ============================================================================
// Constants
// ============================================================================
const ZOOM = {
  day:     { pxPerDay: 36 },
  week:    { pxPerDay: 12 },
  month:   { pxPerDay: 3  },
  quarter: { pxPerDay: 1  },
};
const STATUSES = ['planned', 'in-progress', 'blocked', 'done'];
const DEFAULT_COLORS = [
  '#3b82f6','#10b981','#f59e0b','#8b5cf6','#ec4899',
  '#06b6d4','#ef4444','#84cc16','#f97316','#0ea5e9',
];
const DAY_MS = 86400000;
const SAVE_DEBOUNCE_MS = 500;
const UNDO_LIMIT = 50;
const LS_BACKUP_KEY = 'nano-pm:backup';
const LS_BANNER_KEY = 'nano-pm:autosave-banner-dismissed';
const IDB_NAME = 'nano-pm';
const IDB_STORE = 'handles';

// ============================================================================
// Date utils
// ============================================================================
const pad2 = n => String(n).padStart(2, '0');
function fmt(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function parse(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function addDays(d, n) {
  const r = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  return r;
}
function daysBetween(a, b) {
  // a, b are Date at local midnight
  return Math.round((b - a) / DAY_MS);
}
function today() {
  const t = new Date();
  return new Date(t.getFullYear(), t.getMonth(), t.getDate());
}
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d)   { return new Date(d.getFullYear(), d.getMonth() + 1, 0); }
function startOfWeek(d)  {
  // ISO-ish: week starts Monday
  const day = (d.getDay() + 6) % 7;
  return addDays(d, -day);
}
function startOfQuarter(d) {
  const q = Math.floor(d.getMonth() / 3);
  return new Date(d.getFullYear(), q * 3, 1);
}
function isWeekend(d) { const g = d.getDay(); return g === 0 || g === 6; }
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ============================================================================
// Tiny utilities
// ============================================================================
function uid(prefix) {
  return prefix + '_' + Math.random().toString(36).slice(2, 9);
}
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function debounce(fn, ms) {
  let t;
  return function(...args) {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

// ============================================================================
// State
// ============================================================================
let state = { projects: [], people: [], deps: [] };
let zoom = 'week';
let chartStart = startOfMonth(addDays(today(), -30));
let chartEnd = startOfMonth(addDays(today(), 180));
let selected = null; // {type:'task'|'milestone'|'dep', id, depKey?}
let undoStack = [];
let redoStack = [];
let isDirty = false;
let lastSavedAt = null;

let saveHandle = null;       // FileSystemFileHandle
const hasFsApi = typeof window.showOpenFilePicker === 'function';

// ============================================================================
// DOM <-> state
// ============================================================================
function loadFromDom() {
  const data = document.getElementById('data');
  state = { projects: [], people: [], deps: [] };

  for (const el of data.querySelectorAll(':scope > .people > .person')) {
    state.people.push({ id: el.dataset.id, name: el.textContent.trim() });
  }
  for (const projEl of data.querySelectorAll(':scope > .project')) {
    const proj = {
      id: projEl.dataset.id,
      name: (projEl.querySelector(':scope > .name')?.textContent || '').trim(),
      color: projEl.dataset.color || DEFAULT_COLORS[0],
      order: parseInt(projEl.dataset.order || '0', 10),
      tasks: [],
      milestones: [],
    };
    for (const t of projEl.querySelectorAll(':scope > .task')) {
      proj.tasks.push({
        id: t.dataset.id,
        projectId: proj.id,
        title: t.textContent.trim(),
        start: t.dataset.start,
        end: t.dataset.end,
        status: t.dataset.status || 'planned',
        assignees: t.dataset.assignees ? t.dataset.assignees.split(',').filter(Boolean) : [],
      });
    }
    for (const m of projEl.querySelectorAll(':scope > .milestone')) {
      proj.milestones.push({
        id: m.dataset.id,
        projectId: proj.id,
        title: m.textContent.trim(),
        date: m.dataset.date,
      });
    }
    state.projects.push(proj);
  }
  for (const d of data.querySelectorAll(':scope > .dependencies > .dep')) {
    state.deps.push({ from: d.dataset.from, to: d.dataset.to });
  }
  state.projects.sort((a, b) => a.order - b.order);
}

function escapeText(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}
function writeToDom() {
  const data = document.getElementById('data');
  let html = '\n  <div class="people">\n';
  for (const p of state.people) {
    html += `    <div class="person" data-id="${p.id}">${escapeText(p.name)}</div>\n`;
  }
  html += '  </div>\n';
  for (const proj of state.projects) {
    html += `  <div class="project" data-id="${proj.id}" data-color="${proj.color}" data-order="${proj.order}">\n`;
    html += `    <h3 class="name">${escapeText(proj.name)}</h3>\n`;
    for (const t of proj.tasks) {
      const ass = t.assignees.join(',');
      html += `    <div class="task" data-id="${t.id}" data-start="${t.start}" data-end="${t.end}" data-status="${t.status}" data-assignees="${ass}">${escapeText(t.title)}</div>\n`;
    }
    for (const m of proj.milestones) {
      html += `    <div class="milestone" data-id="${m.id}" data-date="${m.date}">${escapeText(m.title)}</div>\n`;
    }
    html += '  </div>\n';
  }
  html += '  <div class="dependencies">\n';
  for (const d of state.deps) {
    html += `    <div class="dep" data-from="${d.from}" data-to="${d.to}"></div>\n`;
  }
  html += '  </div>\n';
  data.innerHTML = html;
}

// ============================================================================
// Geometry
// ============================================================================
function pxPerDay() { return ZOOM[zoom].pxPerDay; }
function dateToX(date) {
  if (typeof date === 'string') date = parse(date);
  return daysBetween(chartStart, date) * pxPerDay();
}
function xToDate(x) {
  return addDays(chartStart, Math.round(x / pxPerDay()));
}
function totalChartWidth() {
  return daysBetween(chartStart, chartEnd) * pxPerDay();
}
function recomputeChartRange() {
  // Ensure chart spans data + reasonable margin around today.
  let earliest = addDays(today(), -30);
  let latest = addDays(today(), 150);
  for (const proj of state.projects) {
    for (const t of proj.tasks) {
      const s = parse(t.start), e = parse(t.end);
      if (s < earliest) earliest = s;
      if (e > latest) latest = e;
    }
    for (const m of proj.milestones) {
      const d = parse(m.date);
      if (d < earliest) earliest = d;
      if (d > latest) latest = d;
    }
  }
  chartStart = startOfMonth(addDays(earliest, -7));
  chartEnd   = startOfMonth(addDays(latest, 30));
}

// ============================================================================
// Rendering: time axis
// ============================================================================
function renderTimeAxis() {
  const axis = document.getElementById('time-axis');
  axis.innerHTML = '';
  const w = totalChartWidth();
  axis.style.width = w + 'px';

  const ppd = pxPerDay();

  // Major header band (top): months for day/week, quarters/year for month, year for quarter
  const major = [];
  if (zoom === 'day' || zoom === 'week') {
    let d = startOfMonth(chartStart);
    while (d <= chartEnd) {
      const next = startOfMonth(addDays(endOfMonth(d), 1));
      const x = dateToX(d);
      const x2 = dateToX(next);
      major.push({ x, w: x2 - x, label: MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear() });
      d = next;
    }
  } else if (zoom === 'month') {
    // Quarter/Year
    let d = startOfQuarter(chartStart);
    while (d <= chartEnd) {
      const next = startOfQuarter(addDays(new Date(d.getFullYear(), d.getMonth() + 3, 1), 0));
      const x = dateToX(d);
      const x2 = dateToX(next);
      const q = Math.floor(d.getMonth() / 3) + 1;
      major.push({ x, w: x2 - x, label: 'Q' + q + ' ' + d.getFullYear() });
      d = next;
    }
  } else { // quarter
    let d = new Date(chartStart.getFullYear(), 0, 1);
    while (d <= chartEnd) {
      const next = new Date(d.getFullYear() + 1, 0, 1);
      const x = dateToX(d);
      const x2 = dateToX(next);
      major.push({ x, w: x2 - x, label: String(d.getFullYear()) });
      d = next;
    }
  }

  for (const m of major) {
    const el = document.createElement('div');
    el.className = 'axis-major';
    el.style.left = m.x + 'px';
    el.style.width = m.w + 'px';
    el.textContent = m.label;
    axis.appendChild(el);
  }

  // Minor band: per zoom
  const minors = [];
  if (zoom === 'day') {
    let d = new Date(chartStart);
    while (d < chartEnd) {
      const x = dateToX(d);
      const label = ['S','M','T','W','T','F','S'][d.getDay()] + ' ' + d.getDate();
      minors.push({ x, w: ppd, label, weekend: isWeekend(d) });
      d = addDays(d, 1);
    }
  } else if (zoom === 'week') {
    let d = startOfWeek(chartStart);
    while (d < chartEnd) {
      const x = dateToX(d);
      const next = addDays(d, 7);
      const w = Math.min(dateToX(next), totalChartWidth()) - x;
      minors.push({ x, w, label: MONTH_NAMES[d.getMonth()] + ' ' + d.getDate() });
      d = next;
    }
  } else if (zoom === 'month') {
    let d = startOfMonth(chartStart);
    while (d < chartEnd) {
      const x = dateToX(d);
      const next = startOfMonth(addDays(endOfMonth(d), 1));
      const w = dateToX(next) - x;
      minors.push({ x, w, label: MONTH_NAMES[d.getMonth()] });
      d = next;
    }
  } else { // quarter
    let d = startOfQuarter(chartStart);
    while (d < chartEnd) {
      const x = dateToX(d);
      const next = new Date(d.getFullYear(), d.getMonth() + 3, 1);
      const w = dateToX(next) - x;
      const q = Math.floor(d.getMonth() / 3) + 1;
      minors.push({ x, w, label: 'Q' + q });
      d = next;
    }
  }

  for (const mn of minors) {
    const el = document.createElement('div');
    el.className = 'axis-minor' + (mn.weekend ? ' weekend' : '');
    el.style.left = mn.x + 'px';
    el.style.width = mn.w + 'px';
    el.textContent = mn.label;
    axis.appendChild(el);
  }
}

// ============================================================================
// Rendering: grid (left column + chart rows)
// ============================================================================
function clearRows() {
  const grid = document.getElementById('grid');
  // Remove all children except the corner and the time-axis-cell.
  for (const child of [...grid.children]) {
    if (child.classList.contains('corner') || child.id === 'time-axis-cell') continue;
    grid.removeChild(child);
  }
}

function renderRows() {
  clearRows();
  const grid = document.getElementById('grid');
  const w = totalChartWidth();

  // For overdue check
  const todayD = today();

  // Build a quick lookup for tasks (used for milestones overdue check etc.)
  const taskById = {};
  for (const proj of state.projects) for (const t of proj.tasks) taskById[t.id] = t;

  for (const proj of state.projects) {

    const projLeft = document.createElement('div');

    projLeft.dataset.projId = proj.id;

    grid.appendChild(projLeft);

    // Weekend tiles for ambiance (only at day/week zoom)

    // Render milestones in the project header row
    for (const m of proj.milestones) {
      const x = dateToX(m.date);

      const dia = document.createElement('div');
      dia.className = 'milestone' + (isPastDue ? ' overdue' : '');
      dia.style.left = (x - 7) + 'px';
      dia.style.background = proj.color;
      dia.dataset.id = m.id;
      dia.title = m.title;
      dia.addEventListener('mousedown', (e) => onMilestoneMouseDown(e, m));
      projRow.appendChild(dia);
      const lab = document.createElement('div');
      lab.className = 'milestone-label';
      lab.style.left = (x + 8) + 'px';
      lab.textContent = m.title;
      projRow.appendChild(lab);
    }
    grid.appendChild(projRow);

    // Task rows
    for (const t of proj.tasks) {
      const left = document.createElement('div');
      left.className = 'left-cell task';
      const ass = t.assignees.map(id => state.people.find(p => p.id === id)?.name?.split(' ')[0] || '?').join(', ');
      left.innerHTML = `<span class="title">${escapeText(t.title)}</span><span class="assignees">${escapeText(ass)}</span>`;
      grid.appendChild(left);

      const row = document.createElement('div');
      row.className = 'chart-row';
      row.dataset.taskId = t.id;
      row.style.width = w + 'px';
      if (zoom === 'day' || zoom === 'week') addWeekendTiles(row);

      const bar = renderBar(t, proj);
      row.appendChild(bar);
      grid.appendChild(row);
    }
  }

  // Today line + arrows overlay live in a layer over the whole chart. We'll
  // insert them as absolutely-positioned children on the rows column. The
  // simplest approach is to pin them to the time-axis container's parent —
  // but our grid has separate rows. Instead we use a single overlay element
  // per chart row strip. For simplicity, place a single overlay sibling that
  // spans the full grid by being absolutely positioned in #grid-scroll.
  ensureOverlay();
  renderArrows();
  positionOverlay();
}

function depsTowardMilestoneDone(m) {
  // We don't track which task "leads" to a milestone in v1; treat any milestone
  // past date as overdue (red ring). Could refine later.
  return false;
}

function addWeekendTiles(row) {
  let d = startOfWeek(chartStart);
  while (d < chartEnd) {
    const sat = addDays(d, 5);
    const sun = addDays(d, 6);
    for (const wd of [sat, sun]) {
      if (wd >= chartStart && wd < chartEnd) {
        const x = dateToX(wd);
        const tile = document.createElement('div');
        tile.className = 'weekend-tile';
        tile.style.left = x + 'px';
        tile.style.width = pxPerDay() + 'px';
        row.appendChild(tile);
      }
    }
    d = addDays(d, 7);
  }
}

function renderBar(t, proj) {
  const x = dateToX(t.start);
  const xe = dateToX(addDays(parse(t.end), 1)); // end-inclusive
  const bar = document.createElement('div');
  const todayD = today();
  const overdue = parse(t.end) < todayD && t.status !== 'done';
  bar.className = 'bar ' + t.status + (overdue ? ' overdue' : '');
  if (selected && selected.type === 'task' && selected.id === t.id) bar.classList.add('selected');
  bar.style.left = x + 'px';
  bar.style.width = Math.max(2, xe - x) + 'px';
  bar.style.background = proj.color;
  bar.dataset.taskId = t.id;
  bar.title = t.title + '  ' + t.start + ' → ' + t.end;
  bar.addEventListener('mousedown', (e) => onBarMouseDown(e, t));
  // Inner label — clips its own text; pointer-events: none so handles still receive clicks.
  const label = document.createElement('span');
  label.className = 'bar-label';
  label.textContent = (t.status === 'done' ? '✓ ' : '') + t.title;
  bar.appendChild(label);
  // Left resize handle — drags the start date, keeps the end fixed.
  const rs = document.createElement('div');
  rs.className = 'resize-handle resize-start';
  rs.addEventListener('mousedown', (e) => { e.stopPropagation(); onResizeStartMouseDown(e, t); });
  bar.appendChild(rs);
  // Right resize handle — drags the end date, keeps the start fixed.
  const re = document.createElement('div');
  re.className = 'resize-handle resize-end';
  re.addEventListener('mousedown', (e) => { e.stopPropagation(); onResizeEndMouseDown(e, t); });
  bar.appendChild(re);
  // Dep handle just outside the right edge.
  const dh = document.createElement('div');
  dh.className = 'dep-handle';
  dh.addEventListener('mousedown', (e) => { e.stopPropagation(); onDepHandleMouseDown(e, t); });
  bar.appendChild(dh);
  return bar;
}

// ============================================================================
// Rendering: today line + dep arrows overlay
// ============================================================================
let overlayEl = null;
let arrowsSvg = null;
let todayLineEl = null;

function ensureOverlay() {
  if (overlayEl && overlayEl.isConnected) return;
  // Remove any stale overlay left over from a previous save serialization.
  for (const stale of document.querySelectorAll('#overlay')) stale.remove();
  overlayEl = document.createElement('div');
  overlayEl.id = 'overlay';
  overlayEl.style.position = 'absolute';
  overlayEl.style.top = '0';
  overlayEl.style.left = 'var(--left-w)';
  overlayEl.style.pointerEvents = 'none';
  arrowsSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  arrowsSvg.setAttribute('id', 'arrows');
  // Leave pointer-events default; only the .hit paths re-enable hit-testing
  // via CSS (`pointer-events: stroke`). The SVG itself must not blanket-intercept
  // events or it covers the bars beneath it.
  arrowsSvg.style.pointerEvents = 'none';
  overlayEl.appendChild(arrowsSvg);
  todayLineEl = document.createElement('div');
  todayLineEl.id = 'today-line';
  overlayEl.appendChild(todayLineEl);
  document.getElementById('grid').appendChild(overlayEl);
}

function positionOverlay() {
  const grid = document.getElementById('grid');
  const w = totalChartWidth();
  // Compute total height from grid rows (excluding axis but including all rows).
  // The grid is laid out as rows; we want the overlay to span from the top of
  // the chart area (below time axis) to the bottom of the last row.
  let h = 0;
  for (const child of grid.children) {
    if (child === overlayEl) continue;
    if (child.classList.contains('corner') || child.id === 'time-axis-cell') continue;
    if (child.classList.contains('chart-row')) {
      h += child.offsetHeight;
    }
  }
  // Total grid height = axis height + sum of chart-row heights.
  const axisH = parseInt(getCssVar('--axis-h'));
  overlayEl.style.top = axisH + 'px';
  overlayEl.style.width = w + 'px';
  overlayEl.style.height = h + 'px';
  arrowsSvg.setAttribute('width', w);
  arrowsSvg.setAttribute('height', h);
  // Today line
  const tx = dateToX(today());
  if (tx >= 0 && tx <= w) {
    todayLineEl.style.left = tx + 'px';
    todayLineEl.style.height = h + 'px';
    todayLineEl.style.display = '';
  } else {
    todayLineEl.style.display = 'none';
  }
}

function getCssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

// Compute the y-center of a task or milestone in the overlay coordinates.
function rowYCenter(taskId) {
  // Walk through the rendered grid in render order and accumulate heights.
  const grid = document.getElementById('grid');
  let y = 0;
  for (const child of grid.children) {
    if (child === overlayEl) continue;
    if (child.classList.contains('corner') || child.id === 'time-axis-cell') continue;
    // Only chart-rows contribute to overlay y; left-cells don't (they share a row).
    if (!child.classList.contains('chart-row')) continue;
    if (child.dataset.taskId === taskId) {
      return y + child.offsetHeight / 2;
    }
    y += child.offsetHeight;
  }
  return -1;
}

function taskBarBounds(taskId) {
  for (const proj of state.projects) {
    const t = proj.tasks.find(t => t.id === taskId);
    if (t) {
      const x1 = dateToX(t.start);
      const x2 = dateToX(addDays(parse(t.end), 1));
      const y = rowYCenter(t.id);
      return { x1, x2, y };
    }
  }
  return null;
}

function renderArrows() {
  const w = totalChartWidth();
  arrowsSvg.innerHTML = '';
  // arrowhead marker
  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L7,4 z" fill="#475569"/>
    </marker>
    <marker id="arrowhead-sel" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L7,4 z" fill="#dc2626"/>
    </marker>
  `;
  arrowsSvg.appendChild(defs);

  for (const dep of state.deps) {
    const a = taskBarBounds(dep.from);
    const b = taskBarBounds(dep.to);
    if (!a || !b) continue;
    const sel = selected && selected.type === 'dep' && selected.depKey === dep.from + '|' + dep.to;
    const stub = 8;
    let d;
    if (a.x2 + stub <= b.x1) {
      // Normal forward case: end of A → right stub → vertical → left of B
      const midX = a.x2 + Math.min((b.x1 - a.x2) / 2, 16);
      d = `M ${a.x2} ${a.y} L ${a.x2 + stub} ${a.y} L ${a.x2 + stub} ${b.y} L ${b.x1} ${b.y}`;
    } else {
      // Successor starts before predecessor ends: route around (right, down, left, down, right)
      const dy = b.y > a.y ? 14 : -14;
      d = `M ${a.x2} ${a.y} L ${a.x2 + stub} ${a.y} L ${a.x2 + stub} ${a.y + dy} L ${b.x1 - stub} ${a.y + dy} L ${b.x1 - stub} ${b.y} L ${b.x1} ${b.y}`;
    }
    // Hit area (wider, transparent)
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hit.setAttribute('class', 'hit');
    hit.setAttribute('d', d);
    hit.dataset.dep = dep.from + '|' + dep.to;
    hit.addEventListener('click', (e) => onDepClick(e, dep));
    arrowsSvg.appendChild(hit);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('marker-end', sel ? 'url(#arrowhead-sel)' : 'url(#arrowhead)');
    if (sel) path.classList.add('selected');
    arrowsSvg.appendChild(path);
  }
}

// ============================================================================
// Top-level render
// ============================================================================
function render() {
  recomputeChartRange();
  // Update zoom button active state
  for (const b of document.querySelectorAll('#zoom-controls button')) {
    b.classList.toggle('active', b.dataset.zoom === zoom);
  }
  renderTimeAxis();
  renderRows();
}

// ============================================================================
// Selection
// ============================================================================
function setSelection(sel) {
  selected = sel;
  // Toggle selection classes in place. A full re-render here would replace
  // any element whose handlers are mid-gesture (e.g. a bar being dragged),
  // leaving the gesture's e.currentTarget pointing at an orphan.
  for (const el of document.querySelectorAll('.bar.selected, .chart-row .milestone.selected')) {
    el.classList.remove('selected');
  }
  if (sel) {
    if (sel.type === 'task') {
      const el = document.querySelector(`.bar[data-task-id="${sel.id}"]`);
      if (el) el.classList.add('selected');
    } else if (sel.type === 'milestone') {
      const el = document.querySelector(`.chart-row .milestone[data-id="${sel.id}"]`);
      if (el) el.classList.add('selected');
    }
  }
  // Dep selection drives arrow stroke colour; just re-paint arrows.
  if (arrowsSvg) renderArrows();
}

// ============================================================================
// Auto-cascade
// ============================================================================
// Build successors map: { taskId -> [taskId, ...] }
function successorsMap() {
  const m = {};
  for (const d of state.deps) (m[d.from] ||= []).push(d.to);
  return m;
}
// Detect cycle if we add edge from→to.
function wouldCycle(from, to) {
  if (from === to) return true;
  // Check if there's a path from `to` back to `from`.
  const succ = successorsMap();
  const seen = new Set();
  const stack = [to];
  while (stack.length) {
    const n = stack.pop();
    if (n === from) return true;
    if (seen.has(n)) continue;
    seen.add(n);
    for (const s of succ[n] || []) stack.push(s);
  }
  return false;
}
// Apply auto-cascade: shift all transitive successors of taskId so that the
// minimum gap to their predecessors is preserved. We only push forward; if a
// successor is already far enough ahead, leave it alone.
function autoCascade() {
  // Topological order over tasks reachable forward
  const succ = successorsMap();
  const taskById = {};
  for (const proj of state.projects) for (const t of proj.tasks) taskById[t.id] = t;
  // Predecessors map
  const preds = {};
  for (const d of state.deps) (preds[d.to] ||= []).push(d.from);

  // Repeatedly walk; for each task, if any predecessor's end+1 > task.start, shift.
  // We iterate until fixed point. Each shift preserves the slack for downstream
  // tasks because we only push them later by the same delta we push the parent.
  let changed = true;
  let safety = 1000;
  while (changed && safety-- > 0) {
    changed = false;
    for (const proj of state.projects) {
      for (const t of proj.tasks) {
        const ps = preds[t.id] || [];
        if (!ps.length) continue;
        let earliestStart = parse(t.start);
        for (const pid of ps) {
          const p = taskById[pid];
          if (!p) continue;
          const minStart = addDays(parse(p.end), 1);
          if (minStart > earliestStart) earliestStart = minStart;
        }
        const curStart = parse(t.start);
        const delta = daysBetween(curStart, earliestStart);
        if (delta > 0) {
          t.start = fmt(addDays(curStart, delta));
          t.end   = fmt(addDays(parse(t.end), delta));
          changed = true;
        }
      }
    }
  }
}

// ============================================================================
// Mutation helpers (with snapshots, write-through, debounced save)
// ============================================================================
function snapshot() {
  const s = JSON.stringify(state);
  if (undoStack.length > 0 && undoStack[undoStack.length - 1] === s) return;
  undoStack.push(s);
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
}
function commit() {
  writeToDom();
  isDirty = true;
  updateSaveStatus();
  scheduleSave();
}
function commitAndRender() {
  commit();
  render();
}
function undo() {
  if (undoStack.length === 0) return;
  redoStack.push(JSON.stringify(state));
  state = JSON.parse(undoStack.pop());
  commitAndRender();
}
function redo() {
  if (redoStack.length === 0) return;
  undoStack.push(JSON.stringify(state));
  state = JSON.parse(redoStack.pop());
  commitAndRender();
}

// ============================================================================
// Bar interactions: drag to move
// ============================================================================
function onBarMouseDown(e, t) {
  if (e.button !== 0) return;
  e.preventDefault();
  hidePopover();
  setSelection({ type: 'task', id: t.id });
  const startX = e.clientX;
  const origStart = parse(t.start);
  const origEnd = parse(t.end);
  const target = e.currentTarget;
  target.classList.add('dragging');
  let moved = false;
  const ppd = pxPerDay();
  const onMove = (ev) => {
    const dxPx = ev.clientX - startX;
    const dxDays = Math.round(dxPx / ppd);
    if (dxDays !== 0) moved = true;
    const ns = addDays(origStart, dxDays);
    const ne = addDays(origEnd, dxDays);
    target.style.left = dateToX(fmt(ns)) + 'px';
    // width unchanged
  };
  const onUp = (ev) => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    target.classList.remove('dragging');
    if (!moved) {
      // Click: open popover
      openTaskPopover(t.id, target);
      return;
    }
    const dxPx = ev.clientX - startX;
    const dxDays = Math.round(dxPx / ppd);
    if (dxDays === 0) { render(); return; }
    snapshot();
    t.start = fmt(addDays(origStart, dxDays));
    t.end   = fmt(addDays(origEnd, dxDays));
    autoCascade();
    commitAndRender();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function onResizeEndMouseDown(e, t) {
  if (e.button !== 0) return;
  e.preventDefault();
  hidePopover();
  setSelection({ type: 'task', id: t.id });
  const startX = e.clientX;
  const origEnd = parse(t.end);
  const startD = parse(t.start);
  const ppd = pxPerDay();
  const bar = e.currentTarget.parentElement;
  bar.classList.add('dragging');
  const onMove = (ev) => {
    const dxPx = ev.clientX - startX;
    const dxDays = Math.round(dxPx / ppd);
    let ne = addDays(origEnd, dxDays);
    if (ne < startD) ne = startD;
    const x1 = dateToX(t.start);
    const x2 = dateToX(addDays(ne, 1));
    bar.style.width = Math.max(2, x2 - x1) + 'px';
  };
  const onUp = (ev) => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    bar.classList.remove('dragging');
    const dxPx = ev.clientX - startX;
    const dxDays = Math.round(dxPx / ppd);
    if (dxDays === 0) { render(); return; }
    let ne = addDays(origEnd, dxDays);
    if (ne < startD) ne = startD;
    snapshot();
    t.end = fmt(ne);
    autoCascade();
    commitAndRender();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function onResizeStartMouseDown(e, t) {
  if (e.button !== 0) return;
  e.preventDefault();
  hidePopover();
  setSelection({ type: 'task', id: t.id });
  const startX = e.clientX;
  const origStart = parse(t.start);
  const origEnd = parse(t.end);
  const ppd = pxPerDay();
  const bar = e.currentTarget.parentElement;
  bar.classList.add('dragging');
  const onMove = (ev) => {
    const dxPx = ev.clientX - startX;
    const dxDays = Math.round(dxPx / ppd);
    let ns = addDays(origStart, dxDays);
    if (ns > origEnd) ns = origEnd;
    const x1 = dateToX(fmt(ns));
    const x2 = dateToX(addDays(origEnd, 1));
    bar.style.left = x1 + 'px';
    bar.style.width = Math.max(2, x2 - x1) + 'px';
  };
  const onUp = (ev) => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    bar.classList.remove('dragging');
    const dxPx = ev.clientX - startX;
    const dxDays = Math.round(dxPx / ppd);
    if (dxDays === 0) { render(); return; }
    let ns = addDays(origStart, dxDays);
    if (ns > origEnd) ns = origEnd;
    snapshot();
    t.start = fmt(ns);
    // No autoCascade needed: pulling the start earlier never violates a FS
    // dependency (predecessors are unaffected); pushing it later doesn't
    // shrink any predecessor's slack either.
    commitAndRender();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// Drag from a bar's dep-handle to another bar to create a dependency.
function onDepHandleMouseDown(e, fromTask) {
  if (e.button !== 0) return;
  e.preventDefault();
  hidePopover();
  // Visual: a temporary path from the source bar's right edge to the cursor.
  const dragLine = document.createElementNS('http://www.w3.org/2000/svg','svg');
  dragLine.setAttribute('id','dep-drag-svg');
  dragLine.style.position = 'absolute';
  dragLine.style.left = '0';
  dragLine.style.top = '0';
  dragLine.style.width = totalChartWidth() + 'px';
  dragLine.style.height = overlayEl.style.height;
  dragLine.style.pointerEvents = 'none';
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('stroke', '#1a1a1a');
  path.setAttribute('stroke-width', '1.5');
  path.setAttribute('stroke-dasharray', '4 3');
  path.setAttribute('fill', 'none');
  dragLine.appendChild(path);
  overlayEl.appendChild(dragLine);

  const a = taskBarBounds(fromTask.id);
  const overlayRect = overlayEl.getBoundingClientRect();
  const updatePath = (px, py) => {
    path.setAttribute('d', `M ${a.x2} ${a.y} L ${px} ${py}`);
  };
  const onMove = (ev) => {
    const px = ev.clientX - overlayRect.left + document.getElementById('grid-scroll').scrollLeft;
    const py = ev.clientY - overlayRect.top + document.getElementById('grid-scroll').scrollTop;
    updatePath(px, py);
  };
  const onUp = (ev) => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    dragLine.remove();
    // Detect drop target: was it a bar?
    const target = document.elementFromPoint(ev.clientX, ev.clientY);
    let hit = target;
    while (hit && !(hit.classList && hit.classList.contains('bar'))) hit = hit.parentElement;
    if (!hit) return;
    const toId = hit.dataset.taskId;
    if (!toId || toId === fromTask.id) return;
    if (state.deps.some(d => d.from === fromTask.id && d.to === toId)) return; // already exists
    if (wouldCycle(fromTask.id, toId)) {
      flashError('That dependency would create a cycle.');
      return;
    }
    snapshot();
    state.deps.push({ from: fromTask.id, to: toId });
    autoCascade();
    commitAndRender();
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function onDepClick(e, dep) {
  e.stopPropagation();
  setSelection({ type: 'dep', depKey: dep.from + '|' + dep.to });
}

// ============================================================================
// Project header row: rubber-band to create a new task
// ============================================================================
function onProjectRowMouseDown(e, projectId) {
  if (e.button !== 0) return;
  // Don't trigger if clicking on a milestone or its label
  if (e.target.classList.contains('milestone') || e.target.classList.contains('milestone-label')) return;
  e.preventDefault();
  hidePopover();
  const row = e.currentTarget;
  const rect = row.getBoundingClientRect();
  const startX = e.clientX - rect.left;
  const rb = document.createElement('div');
  rb.id = 'rubber-band';
  rb.style.left = startX + 'px';
  rb.style.top = '4px';
  rb.style.height = (row.offsetHeight - 8) + 'px';
  rb.style.width = '0px';
  row.appendChild(rb);
  let moved = false;
  const onMove = (ev) => {
    const x = ev.clientX - rect.left;
    const lo = Math.min(startX, x);
    const hi = Math.max(startX, x);
    rb.style.left = lo + 'px';
    rb.style.width = (hi - lo) + 'px';
    if (Math.abs(x - startX) > 4) moved = true;
  };
  const onUp = (ev) => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    rb.remove();
    if (!moved) return;
    const x = ev.clientX - rect.left;
    const lo = Math.min(startX, x);
    const hi = Math.max(startX, x);
    const startDate = fmt(xToDate(lo));
    const endDate = fmt(xToDate(hi));
    if (daysBetween(parse(startDate), parse(endDate)) < 1) return;
    snapshot();
    const proj = state.projects.find(p => p.id === projectId);
    const t = {
      id: uid('t'),
      projectId,
      title: 'New task',
      start: startDate,
      end: endDate,
      status: 'planned',
      assignees: [],
    };
    proj.tasks.push(t);
    commitAndRender();
    // Open popover for editing
    setTimeout(() => {
      const bar = document.querySelector(`.bar[data-task-id="${t.id}"]`);
      if (bar) openTaskPopover(t.id, bar);
    }, 0);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function findTask(id) {
  for (const p of state.projects) {
    const t = p.tasks.find(t => t.id === id);
    if (t) return t;
  }
  return null;
}
function findMilestone(id) {
  for (const p of state.projects) {
    const m = p.milestones.find(m => m.id === id);
    if (m) return m;
  }
  return null;
}
function findProject(id) { return state.projects.find(p => p.id === id); }

function openTaskPopover(taskId, anchorEl) {
  const t = findTask(taskId);
  if (!t) return;
  const proj = findProject(t.projectId);
  const pop = document.getElementById('popover');
  // Build the dependencies section: predecessors (depends on) + successors (blocks).
  const preds = state.deps.filter(d => d.to === t.id);
  const succs = state.deps.filter(d => d.from === t.id);
  let depsListHtml;
  if (preds.length === 0 && succs.length === 0) {
    depsListHtml = `<div class="deps-empty">No dependencies. Drag from a bar's right-edge handle onto another bar to create one.</div>`;
  } else {
    const rows = [];
    for (const d of preds) {
      const p = findTask(d.from);

        <button class="dep-remove" data-key="${d.from}|${d.to}" title="Remove dependency">×</button>
      </div>`);
    }
    for (const d of succs) {
      const s = findTask(d.to);
      if (!s) continue;
      rows.push(`<div class="dep-row">
        <span class="dep-arrow">↓ blocks</span>
        <span class="dep-name">${escapeText(s.title)}</span>

    </div>
    <div class="row">
      <div>
        <label>Start</label>
        <input type="date" id="po-start" value="${t.start}">
      </div>
      <div>
        <label>End</label>
        <input type="date" id="po-end" value="${t.end}">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Status</label>
        <select id="po-status">
          ${STATUSES.map(s => `<option value="${s}"${s===t.status?' selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Project</label>

      <label>Assignees</label>

      <label>Dependencies</label>
      <div class="deps-list">${depsListHtml}</div>
    </div>

      <button class="danger" id="po-delete">Delete</button>
      <button class="primary" id="po-done">Done</button>
    </div>
  `;
  pop.hidden = false;
  positionPopover(pop, anchorEl);
  // assignees rendering
  const assigEl = document.getElementById('po-assignees');
  function renderAssignees() {
    assigEl.innerHTML = '';
    for (const pid of t.assignees) {
      const person = state.people.find(p => p.id === pid);
      if (!person) continue;
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.innerHTML = `${escapeText(person.name)} <button data-id="${pid}" title="Remove">×</button>`;
      chip.querySelector('button').addEventListener('click', () => {
        t.assignees = t.assignees.filter(x => x !== pid);
        renderAssignees();
        commit();
      });
      assigEl.appendChild(chip);
    }
    // Add chip
    const remaining = state.people.filter(p => !t.assignees.includes(p.id));
    if (remaining.length > 0) {
      const add = document.createElement('select');
      add.className = 'chip-add';

      add.addEventListener('change', () => {

        snapshot();
        t.assignees.push(add.value);

        commitAndRender();

    }
    if (state.people.length === 0) {
      const hint = document.createElement('span');
      hint.style.color = 'var(--muted)';
      hint.style.fontSize = '11px';
      hint.textContent = 'Add people via the People button.';
      assigEl.appendChild(hint);

      newP.tasks.push(t);
      t.projectId = newProj;

    t.title = newTitle;
    t.start = newStart;

      const sameBar = document.querySelector(`.bar[data-task-id="${t.id}"]`);
      if (sameBar) openTaskPopover(t.id, sameBar);
      else hidePopover();

function moveProject(id, delta) {
  const sorted = [...state.projects].sort((a, b) => a.order - b.order);
  const idx = sorted.findIndex(p => p.id === id);
  const nidx = idx + delta;
  if (nidx < 0 || nidx >= sorted.length) return;
  snapshot();
  // Swap orders
  const a = sorted[idx], b = sorted[nidx];
  const tmp = a.order; a.order = b.order; b.order = tmp;
  state.projects.sort((a, b) => a.order - b.order);
  commitAndRender();
}

function escapeAttr(s) { return escapeText(s).replace(/"/g, '&quot;'); }

function positionPopover(pop, anchorEl) {
  const r = anchorEl.getBoundingClientRect();
  // place below anchor
  let top = r.bottom + 6;
  let left = r.left;
  // measure popover
  const pr = pop.getBoundingClientRect();
  if (left + pr.width > window.innerWidth - 8) left = window.innerWidth - pr.width - 8;
  if (top + pr.height > window.innerHeight - 8) top = r.top - pr.height - 6;
  pop.style.top = Math.max(8, top) + 'px';
  pop.style.left = Math.max(8, left) + 'px';
}

function hidePopover() {
  document.getElementById('popover').hidden = true;
}
function hideProjectPopover() {
  document.getElementById('project-popover').hidden = true;
}

// ============================================================================
// Deletion
// ============================================================================
function deleteTask(id) {
  for (const p of state.projects) p.tasks = p.tasks.filter(t => t.id !== id);
  state.deps = state.deps.filter(d => d.from !== id && d.to !== id);
}
function deleteMilestone(id) {
  for (const p of state.projects) p.milestones = p.milestones.filter(m => m.id !== id);
}
function deleteDep(key) {
  const [from, to] = key.split('|');
  state.deps = state.deps.filter(d => !(d.from === from && d.to === to));
}

// ============================================================================
// Keyboard
// ============================================================================
function onKeyDown(e) {
  if (isTypingTarget(e.target)) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
    return;
  }
  if (e.key === 'T' || e.key === 't') { jumpToToday(); return; }
  if (e.key === '1') { setZoom('day'); return; }
  if (e.key === '2') { setZoom('week'); return; }
  if (e.key === '3') { setZoom('month'); return; }
  if (e.key === '4') { setZoom('quarter'); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (!selected) return;
    e.preventDefault();
    snapshot();
    if (selected.type === 'task') deleteTask(selected.id);
    else if (selected.type === 'milestone') deleteMilestone(selected.id);
    else if (selected.type === 'dep') deleteDep(selected.depKey);
    selected = null;
    commitAndRender();
    return;
  }
  if (e.key === 'Escape') {
    setSelection(null);
    hidePopover();
    hideProjectPopover();
    return;
  }
  if (e.key === 'n' || e.key === 'N') {
    // create a new task in the first project around today
    if (state.projects.length === 0) return;
    snapshot();
    const proj = state.projects[0];
    const t = today();
    const nt = {
      id: uid('t'), projectId: proj.id, title: 'New task',
      start: fmt(t), end: fmt(addDays(t, 3)),
      status: 'planned', assignees: [],
    };
    proj.tasks.push(nt);
    commitAndRender();
    setTimeout(() => {
      const bar = document.querySelector(`.bar[data-task-id="${nt.id}"]`);
      if (bar) openTaskPopover(nt.id, bar);
    }, 0);
  }
}
function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}

function setZoom(z) {
  if (!ZOOM[z]) return;
  zoom = z;
  render();
  // After re-render, reposition the today line scroll
  // (do not auto-scroll on every zoom change; user expectation)
}

function jumpToToday() {
  const scroll = document.getElementById('grid-scroll');
  const tx = dateToX(today());
  const leftW = parseInt(getCssVar('--left-w'));
  scroll.scrollLeft = Math.max(0, tx - (scroll.clientWidth - leftW) / 2);
}

// ============================================================================
// Welcome / first-run
// ============================================================================
function isEmpty() { return state.projects.length === 0 && state.people.length === 0; }
function welcomeDismissed() { return document.body.dataset.welcomed === '1'; }
function maybeShowWelcome() {
  if (isEmpty() && !welcomeDismissed()) document.getElementById('welcome').hidden = false;
}
function startFresh() {
  document.body.dataset.welcomed = '1';
  document.getElementById('welcome').hidden = true;
  render();
  commit();
}
function startDemo() {
  document.body.dataset.welcomed = '1';
  document.getElementById('welcome').hidden = true;
  generateDemo();
  snapshot();
  commitAndRender();
  jumpToToday();
}

// ============================================================================
// People modal
// ============================================================================
function openPeopleModal() {
  const m = document.getElementById('people-modal');
  m.hidden = false;
  renderPeopleList();
}
function closePeopleModal() {
  document.getElementById('people-modal').hidden = true;
}
function renderPeopleList() {
  const list = document.getElementById('people-list');
  list.innerHTML = '';
  for (const p of state.people) {
    const row = document.createElement('div');
    row.className = 'people-row';
    row.innerHTML = `
      <input type="text" value="${escapeAttr(p.name)}" data-id="${p.id}">
      <button class="remove" data-id="${p.id}" title="Remove">×</button>
    `;
    row.querySelector('input').addEventListener('change', (e) => {
      snapshot();
      p.name = e.target.value.trim() || 'Unnamed';
      commitAndRender();
    });
    row.querySelector('.remove').addEventListener('click', () => {
      if (!confirm(`Remove "${p.name}"? They'll be unassigned from all tasks.`)) return;
      snapshot();
      state.people = state.people.filter(x => x.id !== p.id);
      for (const proj of state.projects) for (const t of proj.tasks) {
        t.assignees = t.assignees.filter(id => id !== p.id);
      }
      commitAndRender();
      renderPeopleList();
    });
    list.appendChild(row);
  }
}
function addPerson() {
  const inp = document.getElementById('new-person-name');
  const name = inp.value.trim();
  if (!name) return;
  snapshot();
  state.people.push({ id: uid('p'), name });
  inp.value = '';
  commitAndRender();
  renderPeopleList();
}

// ============================================================================
// Add project (top-bar button)
// ============================================================================
function addProject() {
  snapshot();
  const order = state.projects.length > 0 ? Math.max(...state.projects.map(p => p.order)) + 1 : 1;
  const color = DEFAULT_COLORS[state.projects.length % DEFAULT_COLORS.length];
  const proj = { id: uid('proj'), name: 'New project', color, order, tasks: [], milestones: [] };
  state.projects.push(proj);
  commitAndRender();
  // Open project editor
  setTimeout(() => {
    const left = document.querySelector(`.left-cell.proj[data-proj-id="${proj.id}"]`);
    if (left) openProjectPopover(proj.id, left);
  }, 0);
}

// ============================================================================
// Persistence
// ============================================================================
function updateSaveStatus() {
  const el = document.getElementById('save-status');
  el.classList.toggle('dirty', isDirty);
  if (isDirty) {
    el.textContent = '• Unsaved';
    document.title = '• nano-pm';
  } else if (lastSavedAt) {
    el.textContent = 'Saved at ' + pad2(lastSavedAt.getHours()) + ':' + pad2(lastSavedAt.getMinutes());
    document.title = 'nano-pm';
  } else {
    el.textContent = '';
    document.title = 'nano-pm';
  }
}

const scheduleSave = debounce(() => save(), SAVE_DEBOUNCE_MS);

async function save() {
  // localStorage backup mirror always
  try {
    localStorage.setItem(LS_BACKUP_KEY, JSON.stringify({ state, savedAt: new Date().toISOString() }));
  } catch (e) { /* quota; ignore */ }

  if (saveHandle) {
    try {
      const writable = await saveHandle.createWritable();
      await writable.write(buildFileString());
      await writable.close();
      isDirty = false;
      lastSavedAt = new Date();
      updateSaveStatus();
    } catch (err) {
      console.warn('FS save failed', err);
      // Fall back to download
    }
  }
  // For download mode, save() does nothing; the user clicks Save manually.
}

function buildFileString() {
  // Strip transient runtime UI before serialization so the saved file is clean.
  const ov = document.getElementById('overlay');
  if (ov) ov.remove();
  const flash = document.getElementById('flash-error');
  if (flash) flash.remove();
  // Hide any open popovers / modals so they don't reopen on reload.
  for (const id of ['popover', 'project-popover']) {
    const el = document.getElementById(id);
    if (el) { el.hidden = true; el.innerHTML = ''; }
  }
  for (const id of ['welcome', 'people-modal']) {
    const el = document.getElementById(id);
    if (el && !el.hidden && id !== 'welcome') el.hidden = true;
  }
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  // Re-attach overlay (and re-render arrows/today line so live UI keeps working).
  if (ov) {
    document.getElementById('grid').appendChild(ov);
  }
  return html;
}

async function downloadSave() {
  try {
    localStorage.setItem(LS_BACKUP_KEY, JSON.stringify({ state, savedAt: new Date().toISOString() }));
  } catch (e) { /* ignore */ }
  const blob = new Blob([buildFileString()], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nano-pm.html';
  a.click();
  URL.revokeObjectURL(url);
  isDirty = false;
  lastSavedAt = new Date();
  updateSaveStatus();
}

// IndexedDB helpers for the FS handle
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      req.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(val, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function setupFsHandle() {
  if (!hasFsApi) return;
  try {
    const stored = await idbGet('main');
    if (stored) {
      // Verify permission
      const perm = await stored.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        saveHandle = stored;
        return;
      }
      // Otherwise, will require a click to re-grant (browsers block silent prompts).
    }
  } catch (e) { /* IDB might be blocked */ }
}

async function enableAutosave() {
  if (!hasFsApi) {
    alert('Your browser does not support the File System Access API. Use the Save button to download the file.');
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({
      multiple: false,
      types: [{ description: 'HTML', accept: { 'text/html': ['.html', '.htm'] } }],
    });
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') {
      alert('Write permission was denied.');
      return;
    }
    saveHandle = handle;
    await idbSet('main', handle);
    document.getElementById('autosave-banner').hidden = true;
    document.getElementById('save-btn').hidden = true;
    // Save immediately
    await save();
  } catch (e) {
    if (e.name !== 'AbortError') console.warn(e);
  }
}

function setupSavePath() {
  if (hasFsApi) {
    document.getElementById('save-btn').hidden = true;
    if (!saveHandle && localStorage.getItem(LS_BANNER_KEY) !== '1') {
      document.getElementById('autosave-banner').hidden = false;
    }
  } else {
    // Download mode: show explicit Save button
    document.getElementById('save-btn').hidden = false;
    // Hide banner — autosave isn't an option here.
  }
}

window.addEventListener('beforeunload', (e) => {
  if (isDirty && !saveHandle) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// ============================================================================
// Event wiring
// ============================================================================
function wireEvents() {
  document.getElementById('zoom-controls').addEventListener('click', (e) => {
    if (e.target.dataset.zoom) setZoom(e.target.dataset.zoom);
  });
  document.getElementById('today-btn').addEventListener('click', jumpToToday);
  document.getElementById('people-btn').addEventListener('click', openPeopleModal);
  document.getElementById('add-project-btn').addEventListener('click', addProject);
  document.getElementById('save-btn').addEventListener('click', downloadSave);
  document.getElementById('enable-autosave').addEventListener('click', enableAutosave);
  document.getElementById('dismiss-banner').addEventListener('click', () => {
    document.getElementById('autosave-banner').hidden = true;
    localStorage.setItem(LS_BANNER_KEY, '1');
  });
  document.getElementById('welcome-fresh').addEventListener('click', startFresh);
  document.getElementById('welcome-demo').addEventListener('click', startDemo);
  document.getElementById('add-person-btn').addEventListener('click', addPerson);
  document.getElementById('new-person-name').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addPerson();
  });
  document.getElementById('close-people').addEventListener('click', closePeopleModal);

  // Click outside popover hides it
  document.addEventListener('mousedown', (e) => {
    const pop = document.getElementById('popover');
    const ppop = document.getElementById('project-popover');
    if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('.bar') && !e.target.closest('.milestone')) {
      hidePopover();
    }
    if (!ppop.hidden && !ppop.contains(e.target) && !e.target.closest('.left-cell.proj')) {
      hideProjectPopover();
    }
  });

  document.addEventListener('keydown', onKeyDown);

  // Update overlay on scroll/resize
  document.getElementById('grid-scroll').addEventListener('scroll', () => {
    // Today line, arrows are positioned in #grid which scrolls with the content,
    // so no recompute needed unless we add sticky elements.
  });
  window.addEventListener('resize', () => {
    positionOverlay();
  });
}

// ============================================================================
// Error feedback
// ============================================================================
let errorTimer = null;
function flashError(msg) {
  let el = document.getElementById('flash-error');
  if (!el) {
    el = document.createElement('div');
    el.id = 'flash-error';
    Object.assign(el.style, {
      position: 'fixed', bottom: '20px', left: '50%', transform: 'translateX(-50%)',
      background: '#dc2626', color: 'white', padding: '8px 14px', borderRadius: '6px',
      fontSize: '13px', zIndex: '300', boxShadow: '0 4px 12px rgba(0,0,0,0.15)',
    });
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(errorTimer);
  errorTimer = setTimeout(() => { el.style.display = 'none'; }, 2400);
}

// ============================================================================
// Init
// ============================================================================
async function init() {
  loadFromDom();
  await setupFsHandle();
  setupSavePath();
  wireEvents();
  if (isEmpty()) {
    maybeShowWelcome();
  }
  render();
  // Don't auto-scroll on first run; user picks demo or fresh.
  setTimeout(() => { if (!isEmpty()) jumpToToday(); }, 0);
}
init();
</script>
