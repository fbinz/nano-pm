{% load i18n %}
<c-vars person_name invite_url />
<div id="invite-link-slot">
  <div class="invite-reveal">
    <span>{% blocktrans %}Invite link for <strong>{{ person_name }}</strong>:{% endblocktrans %}</span>
    <input type="text" readonly value="{{ invite_url }}" onclick="this.select()">
  </div>
</div>
