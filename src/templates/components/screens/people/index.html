{% load static i18n %}
<c-vars people teams user is_pm workspace workspaces has_multiple_workspaces />
<c-layouts.app-shell :user="user" :is_pm="is_pm" :workspace="workspace"
    :workspaces="workspaces" :has_multiple_workspaces="has_multiple_workspaces"
    active_nav="people">
  <div id="people-page">
    <div class="people-page-header">
      <h1>{% trans "People" %}</h1>
      <p>{% trans "Team members you can assign to tasks." %}</p>
    </div>
    <c-screens.people.people-content :people="people" :teams="teams" :is_pm="is_pm" />
    <div id="invite-link-slot"></div>
  </div>
</c-layouts.app-shell>
