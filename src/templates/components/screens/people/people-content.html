{% load i18n %}
<c-vars people teams is_pm />
<div id="people-content">
  <section class="teams-section">
    <h2>{% trans "Teams" %}</h2>
    <c-screens.people.teams-list :teams="teams" :is_pm="is_pm" />
    {% if is_pm %}
    <form class="add-team-form"
          data-on:submit__prevent="@post('/teams/create/', { contentType: 'form' })">
      {% csrf_token %}
      <input class="input input-sm" type="text" name="name" value="" placeholder="{% trans 'Add a team…' %}" autocomplete="off">
      <button type="submit" class="btn btn-sm btn-neutral">{% trans "Add" %}</button>
    </form>
    {% endif %}
  </section>

  <section class="people-section">
    <h2>{% trans "People" %}</h2>
    <c-screens.people.people-list :people="people" :teams="teams" :is_pm="is_pm" />
    {% if is_pm %}
    <form class="add-person-form"
          data-on:submit__prevent="@post('/people/create/', { contentType: 'form' })">
      {% csrf_token %}
      <input class="input input-sm" type="text" name="name" placeholder="{% trans 'Add a person…' %}" autocomplete="off">
      <button type="submit" class="btn btn-sm btn-neutral">{% trans "Add" %}</button>
    </form>
    {% endif %}
  </section>
</div>
