{% load i18n %}
<c-vars message />
<div id="toast-slot">
  <div id="workload-status" class="nano-toast success workload-saved-toast" role="status">
    <span>{{ message }}</span>
    <button type="button" class="toast-action"
            data-on:click="el.closest('.nano-toast').remove()">{% trans "Dismiss" %}</button>
  </div>
</div>
