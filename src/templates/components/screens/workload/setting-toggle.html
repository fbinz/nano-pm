{% load i18n %}
<c-vars option />
<form id="workload-setting-{{ option.name }}" method="post"
      action="/workspaces/workload/settings/{{ option.name }}/"
      data-workload-setting="{{ option.name }}" data-enabled="{{ option.enabled|yesno:'true,false' }}"
      data-on:submit__prevent="@post('/workspaces/workload/settings/{{ option.name }}/', { contentType: 'form' })">
  {% csrf_token %}
  <label class="flex gap-3 items-center">
    <input id="workload-switch-{{ option.name }}" type="checkbox" role="switch" class="toggle toggle-sm"
           name="{{ option.name }}" value="on" {% if option.enabled %}checked{% endif %}
           {% if option.help %}aria-describedby="workload-help-{{ option.name }}"{% endif %}
           data-on:change="el.form.requestSubmit()">
    {{ option.label }}
  </label>
  {% if option.help %}<p id="workload-help-{{ option.name }}" class="text-xs text-base-content/60 mt-1">{{ option.help }}</p>{% endif %}
</form>
