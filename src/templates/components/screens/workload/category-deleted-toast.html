{% load i18n %}
<c-vars category />
<div id="toast-slot">
  <div class="nano-toast success workload-category-toast workload-category-deleted-toast" role="status">
    <span><strong>{{ category.name }}</strong> — {% trans "Category deleted." %}</span>
    <button type="button" class="toast-action"
            data-on:click="el.closest('.nano-toast').remove()">{% trans "Dismiss" %}</button>
  </div>
</div>
