{% load i18n %}
<c-vars reports="" single_report="" show_people="false" />
<table class="workload-history-table" aria-label="{% trans 'Recent estimate history' %}">
  <colgroup><col class="workload-history-date"><col></colgroup>
  <thead class="sr-only">
    <tr><th scope="col">{% trans "Reviewed" %}</th><th scope="col">{% trans "Workload allocation" %}</th></tr>
  </thead>
  <tbody>
    {% if single_report %}
      <c-screens.workload.history-row :report="single_report" :show_people="show_people" />
    {% else %}
      {% for report in reports %}<c-screens.workload.history-row :report="report" :show_people="show_people" />{% endfor %}
    {% endif %}
  </tbody>
</table>
