{% load i18n static %}
<c-layouts.app-shell :user="user" :is_pm="is_pm" :workspace="workspace" :workspaces="workspaces" :has_multiple_workspaces="has_multiple_workspaces" :can_view_ideas="can_view_ideas" active_nav="profile">
  <main class="p-4 sm:p-6 max-w-5xl space-y-6">
    <a class="link" href="{% url 'profile' %}">{% trans "My profile" %}</a>
    <h1 class="text-2xl font-bold">{% trans "My workload" %}</h1>
    <c-screens.workload.content :rows="rows" :suggested="suggested" :current="current" :history="history" :total="total" />
  </main>
  <script type="module" src="{% static 'js/workload.js' %}"></script>
</c-layouts.app-shell>
