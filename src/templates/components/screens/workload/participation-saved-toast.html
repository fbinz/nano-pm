{% load i18n %}
<c-vars membership />
<div id="toast-slot">
  <div class="nano-toast success workload-participation-toast" role="status">
    <span><strong>{{ membership.user.username }}</strong> — {% trans "Participation saved." %}</span>
    <button type="button" class="toast-action"
            data-on:click="el.closest('.nano-toast').remove()">{% trans "Dismiss" %}</button>
  </div>
</div>
