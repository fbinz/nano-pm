{% load static i18n %}
<c-vars vm zoom user is_pm workspace workspaces has_multiple_workspaces ppd_unit ppd_unit_min ppd_unit_max ppd_unit_step days_per_unit sidebar_width />
<c-layouts.app-shell :user="user" :is_pm="is_pm" :workspace="workspace"
    :workspaces="workspaces" :has_multiple_workspaces="has_multiple_workspaces"
    :sidebar_width="sidebar_width" active_nav="projects">
  <div id="topbar">
    <label for="app-drawer" class="topbar-btn lg:hidden" aria-label="{% trans 'Open menu' %}">
      <c-lucide name="menu" size="18" />
    </label>
    <c-screens.gantt.show-completed-toggle :show_completed="vm.show_completed" />
    <div class="spacer"></div>
    <div id="zoom-controls">
      <a href="?zoom=day"     class="{% if zoom == 'day' %}active{% endif %}">{% trans "Day" %}</a>
      <a href="?zoom=week"    class="{% if zoom == 'week' %}active{% endif %}">{% trans "Week" %}</a>
      <a href="?zoom=month"   class="{% if zoom == 'month' %}active{% endif %}">{% trans "Month" %}</a>
      <a href="?zoom=quarter" class="{% if zoom == 'quarter' %}active{% endif %}">{% trans "Quarter" %}</a>
    </div>
    <input class="range range-xs" type="range" id="zoom-slider" aria-label="{% trans 'Zoom' %}" title="{% trans 'Zoom' %}"
           min="{{ ppd_unit_min }}" max="{{ ppd_unit_max }}"
           step="{{ ppd_unit_step }}" value="{{ ppd_unit }}"
           data-days-per-unit="{{ days_per_unit }}"
           data-on:wheel__prevent="
             const step = parseFloat(el.step) || 1;
             const sign = evt.deltaY > 0 ? -1 : 1;
             const v = Math.max(parseFloat(el.min), Math.min(parseFloat(el.max), parseFloat(el.value) + sign * step));
             if (v !== parseFloat(el.value)) {
               el.value = v;
               el.dispatchEvent(new Event('input', { bubbles: true }));
             }"
           data-on:input__debounce.150ms="@get(`/zoom/?ppd=${parseFloat(el.value)/parseFloat(el.dataset.daysPerUnit)}`)">
    <button class="topbar-btn" data-on:click="nano.scrollToToday()" title="{% trans 'Jump to today (T)' %}">{% trans "Today" %}</button>
  </div>

  <c-screens.gantt.chart :vm="vm" :is_pm="is_pm" />

  <div id="sidebar-resizer"
       title="{% trans 'Drag to resize sidebar' %}"
       data-on:pointerdown="nano.sidebarResizeStart(evt)"></div>
</c-layouts.app-shell>
