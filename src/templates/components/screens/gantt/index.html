{% load static %}
<c-vars vm zoom user is_pm workspace workspaces has_multiple_workspaces ppd_unit ppd_unit_min ppd_unit_max ppd_unit_step days_per_unit />
<c-layouts.app-shell :user="user" :is_pm="is_pm" :workspace="workspace"
    :workspaces="workspaces" :has_multiple_workspaces="has_multiple_workspaces"
    active_nav="projects">
  <div id="topbar">
    <label for="app-drawer" class="topbar-btn lg:hidden" aria-label="Open menu">
      <c-lucide name="menu" size="18" />
    </label>
    <div class="spacer"></div>
    <div id="zoom-controls">
      <a href="?zoom=day"     class="{% if zoom == 'day' %}active{% endif %}">Day</a>
      <a href="?zoom=week"    class="{% if zoom == 'week' %}active{% endif %}">Week</a>
      <a href="?zoom=month"   class="{% if zoom == 'month' %}active{% endif %}">Month</a>
      <a href="?zoom=quarter" class="{% if zoom == 'quarter' %}active{% endif %}">Quarter</a>
    </div>
    <input type="range" id="zoom-slider" aria-label="Zoom" title="Zoom"
           min="{{ ppd_unit_min }}" max="{{ ppd_unit_max }}"
           step="{{ ppd_unit_step }}" value="{{ ppd_unit }}"
           data-days-per-unit="{{ days_per_unit }}"
           data-on:wheel__prevent="
             const step = parseFloat(el.step) || 1;
             const sign = evt.deltaY > 0 ? -1 : 1;
             const v = Math.max(parseFloat(el.min), Math.min(parseFloat(el.max), parseFloat(el.value) + sign * step));
             if (v !== parseFloat(el.value)) {
               el.value = v;
               el.dispatchEvent(new Event('input', { bubbles: true }));
             }"
           data-on:input__debounce.150ms="@get(`/zoom/?ppd=${parseFloat(el.value)/parseFloat(el.dataset.daysPerUnit)}`)">
    <button class="topbar-btn" data-on:click="nano.scrollToToday()" title="Jump to today (T)">Today</button>
  </div>

  <c-screens.gantt.chart :vm="vm" :is_pm="is_pm" />

  <div id="sidebar-resizer"
       title="Drag to resize sidebar"
       data-on:pointerdown="nano.sidebarResizeStart(evt)"></div>
</c-layouts.app-shell>
