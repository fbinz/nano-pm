{% load i18n %}
<div id="toast-slot">
  <div class="nano-toast success milestone-moved-toast" role="status">
    <span><strong>{{ milestone.title }}</strong> {% trans "moved to" %} {{ milestone.date|date:"Y-m-d" }}.</span>
    <button type="button" class="toast-action"
            data-on:click="el.closest('.nano-toast').remove()">{% trans "Dismiss" %}</button>
  </div>
</div>
