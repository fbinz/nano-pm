{% load i18n %}
{# Milestone editor — rendered into the right drawer (#drawer-slot). #}
<c-vars m projects is_initial="" is_pm="" />
<div id="drawer-slot">
  <form
    id="milestone-popover"
    class="popover"
    data-milestone-id="{{ m.id }}"
    data-original-date="{{ m.date|date:'Y-m-d' }}"
    data-requires-move-reason="{{ m.require_move_reason|yesno:'true,false' }}"
    data-initial="{{ is_initial|yesno:'true,false' }}"
    data-discard-url="/milestones/{{ m.id }}/delete/"
    data-on:submit__prevent="nano.submitMilestoneForm(el)"
  >
    {% csrf_token %}
    <fieldset class="fieldset">
      <label class="label" for="milestone-title">{% trans "Title" %}</label>
      <input id="milestone-title" class="input input-sm w-full" type="text" name="title" value="{{ m.title }}" autofocus>
    </fieldset>
    <fieldset class="fieldset">
      <label class="label" for="milestone-description">{% trans "Description" %}</label>
      <textarea id="milestone-description" class="textarea textarea-sm w-full" name="description" rows="3" required>{{ m.description }}</textarea>
    </fieldset>
    {% if is_pm %}
      <label id="milestone-require-move-reason" class="milestone-move-reason-setting label cursor-pointer py-2">
        <input class="checkbox checkbox-sm" type="checkbox" name="require_move_reason"
               {% if m.require_move_reason %}checked{% endif %}>
        <span>{% trans "Require a reason when moving this milestone" %}</span>
      </label>
    {% endif %}
    <div class="row">
      <fieldset class="fieldset">
        <label class="label" for="milestone-date">{% trans "Date" %}</label>
        <input id="milestone-date" class="input input-sm w-full" type="date" name="date" value="{{ m.date|date:'Y-m-d' }}">
      </fieldset>
      <fieldset class="fieldset">
        <label class="label" for="milestone-project">{% trans "Project" %}</label>
        <select id="milestone-project" class="select select-sm w-full" name="project_id">
          {% for p in projects %}
            <option value="{{ p.id }}" {% if p.id == m.project_id %}selected{% endif %}>{{ p.name }}</option>
          {% endfor %}
        </select>
      </fieldset>
    </div>
    <div class="actions">
      {% if is_initial %}
        <button type="button" class="btn btn-sm btn-ghost text-error danger"
                data-on:click="nano.discardDrawer()">{% trans "Cancel" %}</button>
      {% else %}
        <button type="button" class="btn btn-sm btn-ghost text-error danger"
                data-on:click="confirm('{% trans 'Delete this milestone?' %}') && @post('/milestones/{{ m.id }}/delete/', { headers: { 'X-CSRFToken': '{{ csrf_token }}' } })">{% trans "Delete" %}</button>
      {% endif %}
      <button type="submit" class="btn btn-sm btn-neutral primary">{% trans "Done" %}</button>
    </div>
  </form>
</div>
