{% load i18n %}
{# Project editor — rendered into the right drawer (#drawer-slot). #}
<c-vars project colors destination_workspaces is_pm="False" />
<div id="drawer-slot">
  <form
    id="project-popover"
    class="popover"
    data-on:submit__prevent="@post('/projects/{{ project.id }}/update/', { contentType: 'form' })"
  >
    {% csrf_token %}
    <fieldset class="fieldset">
      <label class="label" for="project-name">{% trans "Name" %}</label>
      <input id="project-name" class="input input-sm w-full" type="text" name="name" value="{{ project.name }}" autofocus>
    </fieldset>
    <fieldset class="fieldset">
      <label class="label" for="project-description">{% trans "Description" %}</label>
      <textarea id="project-description" class="textarea textarea-sm w-full" name="description" rows="3">{{ project.description }}</textarea>
    </fieldset>
    <fieldset class="fieldset">
      <label class="label" for="proj-color-input">{% trans "Color" %}</label>
      <input type="hidden" name="color" value="{{ project.color }}" id="proj-color-input">
      <div class="colors">
        {% for c in colors %}
          <button type="button"
                  class="{% if c == project.color %}active{% endif %}"
                  style="background:{{ c }}"
                  data-on:click="document.getElementById('proj-color-input').value = '{{ c }}'; el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active')); el.classList.add('active')"></button>
        {% endfor %}
      </div>
    </fieldset>
    <div class="row">
      <button type="button" class="topbar-btn"
              data-on:click="@post('/projects/{{ project.id }}/move/?dir=-1', { headers: { 'X-CSRFToken': '{{ csrf_token }}' } })">↑ {% trans "move up" %}</button>
      <button type="button" class="topbar-btn"
              data-on:click="@post('/projects/{{ project.id }}/move/?dir=1', { headers: { 'X-CSRFToken': '{{ csrf_token }}' } })">↓ {% trans "move down" %}</button>
    </div>
    <div class="row">
      <button type="button" id="pp-add-milestone" class="topbar-btn"
              data-on:click="nano.addMilestone({{ project.id }})">{% trans "+ Add milestone" %}</button>
    </div>
    <div class="row">
      <button type="button" id="pp-toggle-complete" class="topbar-btn"
              data-on:click="@post('/projects/{{ project.id }}/set-completed/', { headers: { 'X-CSRFToken': '{{ csrf_token }}' } })">
        {% if project.is_completed %}↩ {% trans "Reopen project" %}{% else %}✓ {% trans "Mark complete" %}{% endif %}
      </button>
    </div>
    {% if destination_workspaces %}
      <fieldset class="fieldset">
        <label class="label" for="project-move-workspace">{% trans "Move to workspace" %}</label>
        <select id="project-move-workspace" class="select select-sm w-full" name="workspace_id">
          {% for ws in destination_workspaces %}
            <option value="{{ ws.id }}">{{ ws.name }}</option>
          {% endfor %}
        </select>
      </fieldset>
      <div class="row">
        <button type="button" id="pp-move-workspace" class="topbar-btn"
                data-on:click="confirm('{% blocktrans with name=project.name|escapejs %}Move project &quot;{{ name }}&quot; to the selected workspace?{% endblocktrans %}') && @post('/projects/{{ project.id }}/move-workspace/', { contentType: 'form', headers: { 'X-CSRFToken': '{{ csrf_token }}' } })">
          {% trans "Move project" %}
        </button>
      </div>
    {% endif %}
    <div class="actions">
      {% if is_pm %}
        <button type="button" class="btn btn-sm btn-ghost text-error danger"
                data-on:click="confirm('{% blocktrans with name=project.name|escapejs %}Delete project &quot;{{ name }}&quot; and all its tasks?{% endblocktrans %}') && @post('/projects/{{ project.id }}/delete/', { headers: { 'X-CSRFToken': '{{ csrf_token }}' } })">{% trans "Delete project" %}</button>
      {% endif %}
      <button type="submit" class="btn btn-sm btn-neutral primary">{% trans "Done" %}</button>
    </div>
  </form>
</div>
