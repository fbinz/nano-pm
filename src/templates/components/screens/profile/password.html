{% load i18n %}
<c-layouts.app-shell :user="user" :is_pm="is_pm" :workspace="workspace" :workspaces="workspaces" :has_multiple_workspaces="has_multiple_workspaces" :can_view_ideas="can_view_ideas" active_nav="profile">
  <main class="p-6 w-full max-w-3xl">
    <a class="link" href="{% url 'profile' %}">{% trans "My profile" %}</a>
    <h1 class="mt-4 text-2xl font-bold">{% trans "Change password" %}</h1>
    <form method="post" id="password-form" class="mt-6 space-y-4">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <div class="fieldset">
          <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {{ field.errors }}
          {% if field.help_text %}<div class="text-sm text-base-content/70" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
        </div>
      {% endfor %}
      <button class="btn btn-neutral" type="submit">{% trans "Change password" %}</button>
    </form>
  </main>
</c-layouts.app-shell>
