{% load i18n %}
{% trans "Sign in — nano-pm" as page_title %}
<c-layouts.base :title="page_title">
  <main class="login-page">
    <form method="post" class="login-card">
      {% csrf_token %}
      <h1>nano-pm</h1>
      <p class="hint">{% trans "Sign in to your projects." %}</p>
      {% if form.errors %}
        <div class="error">{% trans "Invalid username or password." %}</div>
      {% endif %}
      <label>{% trans "Username" %}
        <input type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label>{% trans "Password" %}
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">{% trans "Sign in" %}</button>
      <p class="hint small">{% blocktrans %}Seed data ships with user <code>demo</code> / password <code>demo</code>.{% endblocktrans %}</p>
    </form>
  </main>
</c-layouts.base>
